<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ucuteria</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <!--  Header  -->
    <div class="header">
        <div class="burger">
            <div class="header-logo">
                <button class="btn-logo" onclick="menuMovil.showModal()" aria-label="Abrir menú">
                    <span class="material-symbols-outlined">menu</span>
                </button>
            </div>
            <dialog id="menuMovil">
                <ul>
                    <li><a href="/">Inicio</a></li>
                    <li><a href="/nosotros">Nosotros</a></li>
                    <li><a href="/contacto">Contacto</a></li>
                </ul>
                <button onclick="menuMovil.close()">Cerrar</button>
            </dialog>
        </div>
        <div class="logo">
            <a class="logo" href="">
                <span class="material-symbols-outlined">local_cafe</span>
                <span>UCU<span>tería</span></span>
            </a>
        </div>
        <div class="cart">
            <div class="header-logo">
                <span class="material-symbols-outlined">shopping_cart</span>
            </div>

        </div>
    </div>

    <main>
        <!--  Filtros  -->
        <section class="filtros">
            <div class="categorias">
                <h3 class="filter-title">Categorias</h3>
                <ul class="lista-categorias">
                    <li>
                        <button class="categoria categoria--activa" aria-pressed="true">
                            <span class="material-symbols-outlined">grid_view</span>
                            Todas
                        </button>
                    </li>
                    <li>
                        <button class="categoria" aria-pressed="false">
                            <span class="material-symbols-outlined">local_cafe</span>
                            Café
                        </button>
                    </li>
                    <li>
                        <button class="categoria" aria-pressed="false">
                            <span class="material-symbols-outlined">temp_preferences_eco</span>
                            Te
                        </button>
                    </li>
                    <li>
                        <button class="categoria" aria-pressed="false">
                            <span class="material-symbols-outlined">cake</span>
                            Pasteleria
                        </button>
                    </li>
                    <li>
                        <button class="categoria" aria-pressed="false">
                            <span class="material-symbols-outlined">fastfood</span>
                            Sandwiches
                        </button>
                    </li>
                </ul>
            </div>
            <div class="search-container">
                <div class="ordenarx">
                    <h3 class="filter-title">Ordenar por</h3>
                    <select class="orden" id="orden">
                        <option>Nombre (A–Z)</option>
                        <option>Nombre (Z–A)</option>
                        <option>Precio: menor a mayor</option>
                    </select>
                </div>
                <div class="buscador">
                    <span class="material-symbols-outlined">search</span>
                    <input type="search" id="buscar" placeholder="Buscar producto...">
                </div>
            </div>
        </section>

        <section class="list-container">
            <!--  Lista de los productos  -->
            <div class="lista"></div>
        </section>
    </main>
</body>

</html>
